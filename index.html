<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23371B7A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z'/><circle cx='12' cy='10' r='3'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Back2U - College Campus Lost & Found System</title>
    <meta name="description" content="College campus lost and found web application. Report found items and recover lost belongings with student roll number, class, and name verification." />
    
    <!-- PWA & Android Installation Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#371B7A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />

    <!-- Preconnect fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#F8F9FD] text-[#1F1746] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration & Cache Purging -->
    <script>
      // Instantly clear any stale caches from previous builds
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (const name of names) {
            if (name !== 'back2u-cache-v3') {
              caches.delete(name);
            }
          }
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
            console.log('Back2U PWA ServiceWorker active:', reg.scope);
          }).catch((err) => {
            console.log('Back2U PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
